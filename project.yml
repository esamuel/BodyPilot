name: BodyPilot
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    GENERATE_INFOPLIST_FILE: YES
fileGroups:
  - README.md
  - PRD.md
  - CLAUDE.md
targets:
  BodyPilot:
    type: application
    platform: iOS
    sources:
      - BodyPilot
      - Shared
    dependencies:
      - target: BodyPilot Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.BodyPilot
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
  BodyPilot Watch App:
    type: application
    platform: watchOS
    sources:
      - BodyPilot Watch App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.BodyPilot.watchkitapp
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.yourcompany.BodyPilot
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
schemes:
  BodyPilot:
    build:
      targets:
        BodyPilot: all
    run:
      config: Debug
  BodyPilot Watch App:
    build:
      targets:
        BodyPilot Watch App: all
    run:
      config: Debug
